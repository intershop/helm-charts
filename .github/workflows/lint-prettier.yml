name: 'Prettier format check'
on:
  pull_request:
    paths:
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.json'
      - '**/*.md'
      - '.prettierrc'
      - '.prettierignore'
      - 'package.json'

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier check
        run: npm run format:check
