name: 'Unit test pwa chart'
on:
  pull_request:
    paths:
      - 'charts/pwa/**'

jobs:
  lint-test-pwa-unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Base
        uses: ./.github/template/base
      - name: Unit test
        uses: ./.github/template/unittest
        with:
          chartTestingFile: ct_pwa.yaml
          chartName: pwa
