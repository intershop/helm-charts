name: 'Docs pwa chart'
on:
  pull_request:
    paths:
      - 'charts/pwa/**'

env:
  HELM_DOCS_VERSION: '1.14.2'

jobs:
  lint-test-pwa-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install helm-docs
        shell: bash
        run: |
          curl -sSLo helm-docs.tar.gz "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz"
          tar -xf helm-docs.tar.gz helm-docs
          sudo install -m 0755 helm-docs /usr/local/bin/helm-docs

      - name: Regenerate README from values.yaml
        shell: bash
        run: helm-docs --chart-search-root=charts/pwa --sort-values-order=file

      - name: Verify README.md is up to date
        shell: bash
        run: |
          if ! git diff --exit-code charts/pwa/README.md; then
            echo "::error::charts/pwa/README.md is out of date with values.yaml / README.md.gotmpl."
            echo "Run 'helm-docs --chart-search-root=charts/pwa --sort-values-order=file' locally and commit the result."
            exit 1
          fi
