apiVersion: v2
name: pwa
description: |
  Helm chart for the Intershop Progressive Web App. Deploys two peer tiers:
  the "app" Angular SSR application server (Node.js) behind the proxy and
  the "proxy" reverse-proxy (nginx/OpenResty) as the public front door.
type: application
icon: https://avatars.githubusercontent.com/u/39526063
# Chart version (bump on chart changes, independent of the app).
version: 1.0.0

# Version of the Intershop PWA this chart deploys by default.
appVersion: "12.1.0"

keywords:
  - intershop
  - pwa
  - angular
  - ssr
  - ecommerce

sources:
  - https://github.com/intershop/intershop-pwa

maintainers:
  - name: Intershop PWA Team
