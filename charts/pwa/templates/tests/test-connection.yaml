apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "pwa.componentName" (dict "root" . "component" "proxy") }}-test-connection"
  labels:
    {{- include "pwa.componentLabels" (dict "root" . "component" "proxy") | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      # Any HTTP status proves the proxy Service reaches a serving Pod; a non-2xx (e.g. the
      # ICM backend being unreachable) must not fail the smoke test.
      command: ["sh", "-c"]
      args:
        - >
          wget -S -O /dev/null -T 10
          "http://{{ include "pwa.componentName" (dict "root" . "component" "proxy") }}:{{ .Values.proxy.service.port }}/"
          2>&1 | grep -qE 'HTTP/[0-9.]+ [0-9]{3}'
