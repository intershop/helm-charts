apiVersion: v1
kind: Service
metadata:
  name: {{ include "pwa.componentName" (dict "root" . "component" "app") }}
  labels:
    {{- include "pwa.componentLabels" (dict "root" . "component" "app") | nindent 4 }}
spec:
  type: {{ .Values.app.service.type }}
  selector:
    {{- include "pwa.selectorLabels" (dict "root" . "component" "app") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.app.service.port }}
      targetPort: http
      protocol: TCP
---
{{- if include "pwa.appMetricsEnabled" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pwa.appMetricsFullname" . }}
  labels:
    {{- include "pwa.componentLabels" (dict "root" . "component" "app") | nindent 4 }}
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: {{ .Values.app.ports.metrics | quote }}
spec:
  clusterIP: None
  ports:
    - name: metrics
      port: {{ .Values.app.ports.metrics }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "pwa.selectorLabels" (dict "root" . "component" "app") | nindent 4 }}
{{- end -}}
