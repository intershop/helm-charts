{{- if (.Values.monitoring).enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pwa-prometheus.fullname" . }}
  labels:
    {{- include "pwa.componentLabels" (dict "root" . "component" "prometheus") | nindent 4 }}
spec:
  strategy:
    type: "Recreate"
  replicas: 1
  selector:
    matchLabels:
      {{- include "pwa.selectorLabels" (dict "root" . "component" "prometheus") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pwa.selectorLabels" (dict "root" . "component" "prometheus") | nindent 8 }}
    spec:
      containers:
        - args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.console.libraries=/etc/prometheus/console_libraries
            - --web.console.templates=/etc/prometheus/consoles
            - --web.enable-lifecycle
          image: "{{ .Values.monitoring.prometheus.image.repository }}:{{ .Values.monitoring.prometheus.image.tag }}"
          imagePullPolicy: {{ .Values.monitoring.prometheus.image.pullPolicy }}
          name: {{ .Chart.Name }}
          ports:
            # Dev-only: hostPort exposes Prometheus on the node without an Ingress; it also caps
            # this Deployment to one pod per node. Never enable monitoring on a shared cluster.
            - containerPort: 9090
              hostPort: 9090
              protocol: TCP
          volumeMounts:
            - name: {{ include "pwa-prometheus.config" . }}
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: {{ include "pwa-prometheus.data" . }}
              mountPath: /prometheus
      restartPolicy: Always
      volumes:
        - name: {{ include "pwa-prometheus.config" . }}
          configMap:
            name: {{ include "pwa-prometheus.config" . }}
            items:
              - key: prometheus.yml
                path: prometheus.yml
        - name: {{ include "pwa-prometheus.data" . }}
          persistentVolumeClaim:
            claimName: {{ include "pwa-prometheus.data" . }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pwa-prometheus.fullname" . }}
  labels:
    {{- include "pwa.componentLabels" (dict "root" . "component" "prometheus") | nindent 4 }}
spec:
  ports:
    - name: prometheus
      port: 9090
      targetPort: 9090
  selector:
    {{- include "pwa.selectorLabels" (dict "root" . "component" "prometheus") | nindent 4 }}

---
{{ if ((.Values.monitoring).prometheus).host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pwa-prometheus.fullname" . }}
  labels:
    {{- include "pwa.componentLabels" (dict "root" . "component" "prometheus") | nindent 4 }}
  {{- with ((.Values.monitoring).prometheus).annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.monitoring.prometheus.host }}
      http:
        paths:
          - backend:
              service:
                name: {{ include "pwa-prometheus.fullname" . }}
                port:
                  number: 9090
            path: /
            pathType: Prefix
{{ end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pwa-prometheus.config" . }}
  labels:
    {{- include "pwa.componentLabels" (dict "root" . "component" "prometheus") | nindent 4 }}
data:
  prometheus.yml: |
    scrape_configs:
      - job_name: 'pwa-proxy'
        scrape_interval: 5s
        metrics_path: /metrics
        relabel_configs: &relabel
          - source_labels: [__address__]
            target_label: address
          - source_labels: [__address__]
            regex: '(.*?)\..*'
            replacement: '${1}'
            target_label: instance
        dns_sd_configs:
          - names:
              - _metrics._tcp.{{ include "pwa.proxyMetricsFullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
      - job_name: 'pwa-app'
        scrape_interval: 5s
        metrics_path: /metrics
        relabel_configs: *relabel
        dns_sd_configs:
          - names:
              - _metrics._tcp.{{ include "pwa.appMetricsFullname" . }}.{{ .Release.Namespace }}.svc.cluster.local

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "pwa-prometheus.data" . }}
  labels:
    {{- include "pwa.componentLabels" (dict "root" . "component" "prometheus") | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
{{- end -}}
