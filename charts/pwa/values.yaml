# yaml-language-server: $schema=./values.schema.json

# Default values for pwa-main.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

ssr:
  deployments:
    - theme: b2c
      hpa:
        enabled: true
        minReplicas: 2
        maxReplicas: 8
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 1000
        behavior: null
    - theme: b2b
      hpa:
        enabled: true
        minReplicas: 2
        maxReplicas: 8
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 1000
        behavior: null

updateStrategy: RollingUpdate

image:
  repository: intershophub/intershop-pwa-ssr
  tag: latest
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

upstream:
  icmBaseURL: https://develop.icm.intershop.de

  ## @param cdnPrefixURL The base URL of your CDN
  ## E.g.:
  ## cdnPrefixURL: "https://www.example.com"
  cdnPrefixURL: ""

service:
  type: ClusterIP
  port: 4200

##
## @param hybrid Set to enable PWA Hybrid Approach. This means pages are produced by PWA or ICM.
## You can specify the icm-web-wa service internal URL for Kubernetes deployments.
## Communication cannot be routed through ICM Ingress controller.
##
hybrid:
  enabled: false
  # icmInternalURL: https://kubernetes-icm-web-wa:8443
  # pwaExternalPort: 443

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

podAntiAffinity:
  # enable/disable default anti-affinity
  enabled: true
  # enable/disable hard rule for distributing pods across nodes
  # true: use requiredDuringSchedulingIgnoredDuringExecution (hard rule; pod may stay Pending if no suitable node is available)
  # false: use preferredDuringSchedulingIgnoredDuringExecution (soft rule; best-effort)
  required: false

## Annotations for SSR Pods and SSR deployment
## ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
deploymentAnnotations: {}

### Labels for SSR Pods and SSR deployment
### ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}
deploymentLabels: {}

## @param environment Extra environment variables to be set on SSR containers
## E.g.:
## environment:
##   - name: FOO
##     value: BAR
##   - name: FEATURES
##     value: |
##       - punchout
##       - quickorder
##   - name: IDENTITY_PROVIDERS
##     value: |
##       {
##         "Punchout": {"type": "PUNCHOUT"}
##       }
environment: []

## Prometheus Exporter / Metrics
##
metrics:
  ## @param metrics.enabled Expose Prometheus metrics of SSR container
  ##
  enabled: false

livenessProbe: {}
  # exec:
  #   command:
  #   - /bin/sh
  #   - -c
  #   - netstat -an | egrep 4200.*LISTEN | grep 4200
  # initialDelaySeconds: 10
  # periodSeconds: 30

readinessProbe: {}
  # exec:
  #   command:
  #   - /bin/sh
  #   - -c
  #   - netstat -an | egrep 4200.*LISTEN | grep 4200
  # initialDelaySeconds: 10
  # periodSeconds: 30

cache:
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 750
    behavior: null

  ####
  ## @param nginx ignore query parameters during caching
  ##   cacheIgnoreParams: |
  ##     params:
  ##       - utm_source
  ##       - utm_campaign
  #### empty cacheIgnoreParams example
  ##   cacheIgnoreParams: |
  ##     params: []
  cacheIgnoreParams: ""

  ####
  ## @param Multi-channel/-site configuration object
  ##  multiChannel: |
  ##    .+:
  ##      - baseHref: /b2b
  ##        channel: default
  ##      - baseHref: /b2c
  ##        channel: default
  ##        theme: b2c
  multiChannel: ""

  ####
  ## @param additional headers configuration object
  ## additionalHeaders: |
  ##   headers:
  ##     - X-Frame-Options: 'SAMEORIGIN'
  #### no additional headers example
  ##   additionalHeaders: |
  ##     headers: []
  additionalHeaders: ""

  ####
  ## @param extraEnvVars Extra environment variables to be set on NGINX containers
  ## E.g:
  ##  extraEnvVars:
  ##    - name: MULTI_CHANNEL
  ##      value: |
  ##        .+:
  ##          - baseHref: /en
  ##            channel: default
  ##            lang: en_US
  ##          - baseHref: /de
  ##            channel: default
  ##            lang: de_DE
  ##    - name: FOO
  ##      value: BAR
  extraEnvVars:
    - name: MULTI_CHANNEL
      value: |
        .+:
          - baseHref: /en
            channel: inSPIRED-inTRONICS_Business-Site
            lang: en_US
            theme: b2b
          - baseHref: /de
            channel: inSPIRED-inTRONICS_Business-Site
            lang: de_DE
            theme: b2b
          - baseHref: /fr
            channel: inSPIRED-inTRONICS_Business-Site
            lang: fr_FR
            theme: b2b
          - baseHref: /b2c
            channel: inSPIRED-inTRONICS-Site
            theme: b2c

  ## @param reset Enable cache reset job after upgrade
  ## reset:
  ##   enabled: true
  ##   image:
  ##     repository: bitnami/kubectl
  ##     tag: latest
  reset:
    enabled: true
    image:
      repository: ishcp.azurecr.io/ishops/cronjob-utils
      tag: "1"
      pullPolicy: Always

  ####
  ## @param prefetch Specify settings for the prefetch job that heats up caches
  ## E.g.:
  ## prefetch:
  ##   - host: customer-int.pwa.intershop.de
  ##     path: /
  ##     cron: "0 0 * * *"
  prefetch: []

  ## Prometheus Exporter / Metrics
  ##
  metrics:
    ## @param metrics.enabled Expose Prometheus metrics of NGINX container
    ##
    enabled: false

  image:
    repository: intershophub/intershop-pwa-nginx
    tag: latest
    pullPolicy: Always

  nameOverride: ""
  fullnameOverride: ""

  service:
    type: ClusterIP
    port: 4200

  resources: {}

  nodeSelector: {}

  tolerations: []

  affinity: {}

  podAntiAffinity:
    # enable/disable default anti-affinity
    enabled: true
    # enable/disable hard rule for distributing pods across nodes
    # true: use requiredDuringSchedulingIgnoredDuringExecution (hard rule; pod may stay Pending if no suitable node is available)
    # false: use preferredDuringSchedulingIgnoredDuringExecution (soft rule; best-effort)
    required: false

  ## Annotations for nginx Pods and nginx deployment
  ## ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  podAnnotations: {}
  deploymentAnnotations: {}

  ### Labels for nginx/cache Pods and nginx/cache deployment
  ### ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  podLabels: {}
  deploymentLabels: {}

  livenessProbe: {}

  readinessProbe: {}

ingress:
  enabled: false
  className: nginx

## example for enabled and configured Ingress
# ingress:
#   enabled: true
#   className: nginx
#   instances:
#     ingress:
#       annotations:
#         kubernetes.io/tls-acme: "false"
#       tlsSecretName: tls-star-pwa-intershop-de
#       hosts:
#         - host: pwa.example.local

# Calculated values
# use with `{{ tpl $.Values.calculated.X.Y $ }}`
calculated:
  metrics:
    pwa: "{{ if or (.Values.metrics).enabled (.Values.monitoring).enabled }}on{{ end }}"
    nginx: "{{ if or (.Values.cache.metrics).enabled (.Values.monitoring).enabled }}on{{ end }}"
