# yaml-language-server: $schema=./values.schema.json

# Default values for the pwa chart.
# This chart deploys two peer tiers:
#   app   -> Angular SSR application server (Node.js), sits behind the proxy
#   proxy -> nginx/OpenResty reverse proxy (public front door)

# -- Overrides for the chart name used in resource names.
nameOverride: ""
fullnameOverride: ""

# General or shared values.
config:
  # -- Base URL of the Intershop Commerce Management (ICM) backend.
  # Required; intentionally empty so installs must set a real backend and fail fast rather than defaulting to a dev URL.
  icmBaseUrl: ""
  # -- Internal base URL of the Intershop Commerce Management (ICM) backend for SSR.
  # icmBaseUrlSsr: "http://icm-<cstmr-id>-<env>-icm-web-wa.icm-<cstmr-id>-<env>.svc.cluster.local:8080"
  # -- ALLOWED_HOSTS: "shop.example.com,*.example.com".
  # allowedHosts: "shop.example.com,*.example.com"

## @param hybrid Set to enable PWA Hybrid Approach. This means pages are produced by PWA or ICM.
## You can specify the icm-web-wa service internal URL for Kubernetes deployments.
## Communication cannot be routed through ICM Ingress controller.
##
hybrid:
  enabled: false
  # icmInternalURL: https://kubernetes-icm-web-wa:8443
  # pwaExternalPort: 443

# Image pull secrets applied to both tiers' pods.
imagePullSecrets: []
# - name: regcred

serviceAccount:
  # -- Create a ServiceAccount for the workloads.
  create: true
  # -- Auto-mount the API token into pods. Disabled by default; the default cache-clearer
  # reaches SSR via UPSTREAM_PWA (Service DNS), not the k8s API. Enable (plus endpoints RBAC)
  # only for per-Pod SSR cache purging via the Endpoints API.
  automount: false
  # -- Name of the ServiceAccount to use. Generated if empty and create=true.
  name: ""
  # -- Annotations to add to the ServiceAccount.
  annotations: {}

# Container-level security context shared by both tiers as a secure baseline.
# readOnlyRootFilesystem is disabled because both upstream images write into their
# own image filesystem at startup (nginx renders its config, the SSR image generates
# its PM2 ecosystem.yml), so a read-only root filesystem would prevent them from starting.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# ---------------------------------------------------------------------------
# app — Angular SSR application server (Node.js)
# ---------------------------------------------------------------------------
app:
  image:
    repository: intershophub/intershop-pwa-ssr
    # -- Image tag. Defaults to the chart appVersion when empty.
    tag: ""
    pullPolicy: IfNotPresent

  # -- Number of app replicas (ignored when autoscaling.enabled=true).
  replicaCount: 2

  # Ports exposed by the SSR container.
  ports:
    # -- HTTP port the SSR server listens on.
    http: 4200
    # -- Prometheus metrics port.
    metrics: 9113

  service:
    type: ClusterIP
    # -- Service port that the proxy talks to.
    port: 4200

  # Extra environment variables for the SSR server.
  # ICM_BASE_URL, ICM_BASE_URL_SSR, ALLOWED_HOSTS are injected from .config automatically.
  env: []
  # - name: LOGLEVEL
  #   value: "info"
  # - name: LOGFORMAT
  #   value: "text"

  # Expose Prometheus metrics of SSR container
  metrics:
    enabled: false

  # Pod security context for the app. The SSR image runs as an unprivileged user.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault

  # Container security context for the app. Overrides the shared defaults when needed.
  securityContext: {}

  resources:
    requests:
      cpu: "100m"
      memory: "600Mi"
    limits:
      cpu: "1000m"
      memory: "1500Mi"

  # Probes shipped in the SSR image; they check PM2 process health (per theme), not ICM,
  # so a backend outage won't restart or de-register otherwise-healthy Pods.
  startupProbe:
    exec:
      command: ["node", "dist/readinessprobe.js"]
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 30

  livenessProbe:
    exec:
      command: ["node", "dist/livenessprobe.js"]
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    exec:
      command: ["node", "dist/readinessprobe.js"]
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75

  nodeSelector: {}
  tolerations: []
  affinity: {}

  podAntiAffinity:
    # enable/disable default anti-affinity
    enabled: true
    # enable/disable hard rule for distributing pods across nodes
    # true: use requiredDuringSchedulingIgnoredDuringExecution (hard rule; pod may stay Pending if no suitable node is available)
    # false: use preferredDuringSchedulingIgnoredDuringExecution (soft rule; best-effort)
    required: false

  podAnnotations: {}
  podLabels: {}
  deploymentAnnotations: {}
  deploymentLabels: {}

# ---------------------------------------------------------------------------
# proxy — nginx/OpenResty reverse proxy (public front door)
# ---------------------------------------------------------------------------
proxy:
  image:
    repository: intershophub/intershop-pwa-nginx
    # -- Image tag. Defaults to the chart appVersion when empty.
    tag: ""
    pullPolicy: IfNotPresent

  # -- Number of proxy replicas (ignored when autoscaling.enabled=true).
  replicaCount: 2

  ports:
    # -- HTTP port nginx listens on.
    http: 80
    # -- Prometheus metrics port.
    metrics: 9113

  service:
    type: ClusterIP
    # -- Public service port.
    port: 80

  # Extra environment variables for the proxy.
  # UPSTREAM_PWA, ICM_BASE_URL, ICM_BASE_URL_SSR are injected
  # automatically. Add multi-channel / identity-provider config here.
  env: []
  # - name: LOGLEVEL
  #   value: "info"
  # - name: LOGFORMAT
  #   value: "text"

  # Expose Prometheus metrics of nginx container
  metrics:
    enabled: false

  # Multi-Channel/-Site configuration object
  # multiChannel: |
  #   .+:
  #     - baseHref: /b2b
  #       channel: inSPIRED-inTRONICS_Business-Site
  #     - baseHref: /b2c
  #       channel: inSPIRED-inTRONICS-Site
  #       theme: b2c
  multiChannel: ""

  # Additional headers configuration object
  # additionalHeaders: |
  #   headers:
  #     - X-Frame-Options: 'SAMEORIGIN'
  additionalHeaders: ""

  # Ignore query parameters during caching
  # cacheIgnoreParams: |
  #   params:
  #     - utm_source
  #     - utm_campaign
  cacheIgnoreParams: ""

  # Enable proxy reset job after upgrade to purge the proxy cache of the SSR rendered pages.
  reset:
    enabled: true
    image:
      repository: ishcp.azurecr.io/ishops/cronjob-utils
      tag: "1"
      pullPolicy: IfNotPresent

  # Pod security context for the proxy. The upstream OpenResty image starts its master
  # process as root to bind the privileged HTTP port and render its config at startup, so
  # this tier runs as root (workers still drop to an unprivileged user).
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  # Container security context for the proxy. Additional capabilities are required for nginx
  # startup: the master runs as root, renders its config, and drops workers to an unprivileged user.
  securityContext:
    capabilities:
      add:
        - CHOWN
        - SETGID
        - SETUID

  resources:
    requests:
      cpu: "50m"
      memory: "250Mi"
    limits:
      cpu: "1000m"
      memory: "1000Mi"

  # nginx has no backend-independent health URL, so use a TCP check on the http port.
  livenessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    tcpSocket:
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75

  nodeSelector: {}
  tolerations: []
  affinity: {}

  podAntiAffinity:
    # enable/disable default anti-affinity
    enabled: true
    # enable/disable hard rule for distributing pods across nodes
    # true: use requiredDuringSchedulingIgnoredDuringExecution (hard rule; pod may stay Pending if no suitable node is available)
    # false: use preferredDuringSchedulingIgnoredDuringExecution (soft rule; best-effort)
    required: false

  podAnnotations: {}
  podLabels: {}
  deploymentAnnotations: {}
  deploymentLabels: {}

# ---------------------------------------------------------------------------
# Ingress — for external access. Routes public traffic to the proxy
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: nginx
## example for a configured Ingress instance
#   instances:
#     ingress:
#       annotations:
#         kubernetes.io/tls-acme: "false"
#       tlsSecretName: tls-star-pwa-intershop-de
#       hosts:
#         - host: pwa.example.local

# ---------------------------------------------------------------------------
# Monitoring — with Prometheus and Grafana (for development and testing)
# ---------------------------------------------------------------------------
monitoring:
  enabled: false
