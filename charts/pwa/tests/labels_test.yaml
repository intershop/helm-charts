suite: recommended label set (ADR-0050.6 contract)
release:
  name: pwa
set:
  config.icmBaseUrl: https://icm.example.com
tests:
  # --- app / proxy Deployments -------------------------------------------------
  - it: app Deployment carries the full recommended label set
    template: templates/app-deployment.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: pwa
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: pwa
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: app
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: pwa
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - isNotEmpty:
          path: metadata.labels["helm.sh/chart"]

  - it: proxy Deployment carries the full recommended label set
    template: templates/proxy-deployment.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: pwa
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: proxy
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: pwa
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm

  # --- version label tracks the deployed image tag (not just chart appVersion) ---
  - it: app version label defaults to the release-<appVersion> image tag
    template: templates/app-deployment.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: release-12.1.0

  - it: app version label follows an overridden app.image.tag
    template: templates/app-deployment.yaml
    set:
      app.image.tag: analysts_11_1_0_1
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: analysts_11_1_0_1

  - it: proxy version label is independent of the app tier
    template: templates/proxy-deployment.yaml
    set:
      proxy.image.tag: 1.0.175
      app.image.tag: release-14.2.0
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: 1.0.175

  # --- version label reaches the Pods, but never the (immutable) selector ------
  - it: app Pod template carries the version label tracking the tag
    template: templates/app-deployment.yaml
    set:
      app.image.tag: release-14.2.0
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/version"]
          value: release-14.2.0

  - it: the Deployment selector never includes the version label
    template: templates/app-deployment.yaml
    asserts:
      - notExists:
          path: spec.selector.matchLabels["app.kubernetes.io/version"]

  # --- Services ----------------------------------------------------------------
  - it: app Service carries the component label set
    template: templates/app-service.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: pwa
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: app

  - it: proxy Service carries the component label set
    template: templates/proxy-service.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: pwa
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: proxy

  # --- HPAs --------------------------------------------------------------------
  - it: app HPA carries the component label set
    template: templates/app-hpa.yaml
    set:
      app.autoscaling.enabled: true
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: pwa
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: app

  - it: proxy HPA carries the component label set
    template: templates/proxy-hpa.yaml
    set:
      proxy.autoscaling.enabled: true
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: pwa
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: proxy

  # --- ServiceAccount (chart-wide labels, no component) ------------------------
  - it: ServiceAccount carries the chart-wide label set
    template: templates/serviceaccount.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: pwa
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: pwa

  # --- proxy ConfigMap (was hand-written) --------------------------------------
  - it: proxy ConfigMap uses app.kubernetes.io/name=pwa with proxy component
    template: templates/proxy-configmap.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: pwa
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: proxy
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: pwa
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm

  # --- Ingress (was hand-written) ----------------------------------------------
  - it: Ingress uses app.kubernetes.io/name=pwa with proxy component
    template: templates/ingress.yaml
    documentIndex: 0
    set:
      ingress.enabled: true
      ingress.instances.default.hosts[0].host: pwa.example.local
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: pwa
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: proxy
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: pwa

  # --- proxy reset Job + RBAC (previously had no labels) -----------------------
  - it: reset ServiceAccount carries the component label set
    template: templates/proxy-reset-job.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: pwa
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: proxy

  - it: reset Role carries the component label set
    template: templates/proxy-reset-job.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: pwa
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: proxy

  - it: reset RoleBinding carries the component label set
    template: templates/proxy-reset-job.yaml
    documentIndex: 2
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: pwa
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: proxy

  - it: reset Job carries the component label set
    template: templates/proxy-reset-job.yaml
    documentIndex: 3
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: pwa
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: proxy

  # --- monitoring (dev-only, was hand-written) ---------------------------------
  - it: grafana Deployment uses app.kubernetes.io/name=pwa with grafana component
    template: templates/monitoring/grafana.yaml
    documentIndex: 0
    set:
      monitoring.enabled: true
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: pwa
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: grafana
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: pwa
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: grafana

  - it: prometheus Deployment uses app.kubernetes.io/name=pwa with prometheus component
    template: templates/monitoring/prometheus.yaml
    documentIndex: 0
    set:
      monitoring.enabled: true
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: pwa
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: prometheus
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: pwa
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: prometheus
