suite: monitoring stack (dev-only, gated)
release:
  name: pwa
set:
  config.icmBaseUrl: https://icm.example.com
tests:
  - it: renders nothing when monitoring is disabled (default)
    templates:
      - templates/monitoring/grafana.yaml
      - templates/monitoring/prometheus.yaml
    asserts:
      - hasDocuments:
          count: 0
        template: templates/monitoring/grafana.yaml
      - hasDocuments:
          count: 0
        template: templates/monitoring/prometheus.yaml

  - it: deploys grafana with component labels when enabled
    template: templates/monitoring/grafana.yaml
    documentIndex: 0
    set:
      monitoring.enabled: true
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: pwa
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: grafana

  - it: deploys prometheus with component labels when enabled
    template: templates/monitoring/prometheus.yaml
    documentIndex: 0
    set:
      monitoring.enabled: true
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: pwa
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: prometheus

  # SRV records only resolve if the Service name and its port name ("metrics") match.
  - it: prometheus scrapes both tiers via the SRV records of their metrics Services
    template: templates/monitoring/prometheus.yaml
    release:
      namespace: shop
    documentSelector:
      path: kind
      value: ConfigMap
    set:
      monitoring.enabled: true
    asserts:
      - matchRegex:
          path: data["prometheus.yml"]
          pattern: "job_name: 'pwa-proxy'[\\s\\S]*- _metrics\\._tcp\\.pwa-proxy-metrics\\.shop\\.svc\\.cluster\\.local\\s+- job_name: 'pwa-app'[\\s\\S]*- _metrics\\._tcp\\.pwa-app-metrics\\.shop\\.svc\\.cluster\\.local"
