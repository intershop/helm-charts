suite: resource naming and ServiceAccount
release:
  name: pwa
set:
  config.icmBaseUrl: https://icm.example.com
tests:
  - it: default resource name is <release>-<chart>-<component>
    template: templates/app-service.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: pwa-app

  - it: nameOverride is folded into the resource name
    template: templates/app-service.yaml
    documentIndex: 0
    set:
      nameOverride: foo
    asserts:
      - equal:
          path: metadata.name
          value: pwa-foo-app

  - it: fullnameOverride replaces the release+chart prefix
    template: templates/app-service.yaml
    documentIndex: 0
    set:
      fullnameOverride: bar
    asserts:
      - equal:
          path: metadata.name
          value: bar-app

  - it: proxy resource name follows the same scheme
    template: templates/proxy-service.yaml
    documentIndex: 0
    set:
      fullnameOverride: bar
    asserts:
      - equal:
          path: metadata.name
          value: bar-proxy

  # --- ServiceAccount ---------------------------------------------------------
  - it: creates a ServiceAccount by default and both tiers reference it
    documentIndex: 0
    templates:
      - templates/serviceaccount.yaml
      - templates/app-deployment.yaml
      - templates/proxy-deployment.yaml
    asserts:
      - hasDocuments:
          count: 3
        template: templates/serviceaccount.yaml
      - equal:
          path: metadata.name
          value: pwa
        template: templates/serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: pwa
        template: templates/app-deployment.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: pwa
        template: templates/proxy-deployment.yaml

  - it: uses a custom ServiceAccount name when provided
    template: templates/app-deployment.yaml
    set:
      serviceAccount.name: my-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: my-sa

  - it: falls back to the default ServiceAccount when create=false
    templates:
      - templates/serviceaccount.yaml
      - templates/app-deployment.yaml
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default
        template: templates/app-deployment.yaml

  # --- long names: the base is shortened so every suffix survives within 63 chars ---
  - it: keeps the full tier suffix and distinct names for a 63-char fullnameOverride
    templates:
      - templates/app-service.yaml
      - templates/proxy-service.yaml
    set:
      fullnameOverride: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^x{59}-app$
        template: templates/app-service.yaml
        documentIndex: 0
      - matchRegex:
          path: metadata.name
          pattern: ^x{57}-proxy$
        template: templates/proxy-service.yaml
        documentIndex: 0

  - it: keeps metrics Service names within 63 chars
    templates:
      - templates/app-service.yaml
      - templates/proxy-service.yaml
    set:
      fullnameOverride: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      app.metrics.enabled: true
      proxy.metrics.enabled: true
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^x{51}-app-metrics$
        template: templates/app-service.yaml
        documentIndex: 1
      - matchRegex:
          path: metadata.name
          pattern: ^x{49}-proxy-metrics$
        template: templates/proxy-service.yaml
        documentIndex: 1

  - it: keeps reset hook names within 63 chars and consistently wired
    template: templates/proxy-reset-job.yaml
    set:
      fullnameOverride: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^x{51}-proxy-reset$
        documentSelector:
          path: kind
          value: ServiceAccount
      - matchRegex:
          path: metadata.name
          pattern: ^x{47}-proxy-reset-job$
        documentSelector:
          path: kind
          value: Job
      - matchRegex:
          path: spec.template.spec.serviceAccountName
          pattern: ^x{51}-proxy-reset$
        documentSelector:
          path: kind
          value: Job
      - matchRegex:
          path: rules[0].resourceNames[0]
          pattern: ^x{57}-proxy$
        documentSelector:
          path: kind
          value: Role

  - it: the proxy ConfigMap name and its volume reference stay in sync for long names
    templates:
      - templates/proxy-configmap.yaml
      - templates/proxy-deployment.yaml
    set:
      fullnameOverride: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^x{36}-proxy-gomplate-datasources$
        template: templates/proxy-configmap.yaml
      - matchRegex:
          path: spec.template.spec.volumes[?(@.name=='proxy-config-map')].configMap.name
          pattern: ^x{36}-proxy-gomplate-datasources$
        template: templates/proxy-deployment.yaml

  - it: keeps monitoring stack names within 63 chars
    templates:
      - templates/monitoring/prometheus.yaml
      - templates/monitoring/grafana.yaml
    set:
      fullnameOverride: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      monitoring.enabled: true
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^x{52}-prometheus$
        template: templates/monitoring/prometheus.yaml
        documentSelector:
          path: kind
          value: Service
      - matchRegex:
          path: metadata.name
          pattern: ^x{50}-grafana-data$
        template: templates/monitoring/grafana.yaml
        documentSelector:
          path: kind
          value: PersistentVolumeClaim

  - it: never leaves a double hyphen when the cut lands on a hyphen
    template: templates/app-service.yaml
    documentIndex: 0
    set:
      fullnameOverride: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-bcd
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^a{58}-app$

  - it: keeps names valid for the longest release name Helm allows (53 chars)
    template: templates/app-service.yaml
    documentIndex: 1
    release:
      name: rrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr
    set:
      app.metrics.enabled: true
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: ^r{51}-app-metrics$
