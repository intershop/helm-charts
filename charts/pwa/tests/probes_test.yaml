suite: health probes
templates:
  - templates/app-deployment.yaml
  - templates/proxy-deployment.yaml
release:
  name: pwa
set:
  config.icmBaseUrl: https://icm.example.com
tests:
  - it: app uses the image-provided PM2 probe scripts
    template: templates/app-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          value:
            - node
            - /dist/livenessprobe.js
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          value:
            - node
            - /dist/readinessprobe.js
      - equal:
          path: spec.template.spec.containers[0].startupProbe.exec.command
          value:
            - node
            - /dist/readinessprobe.js

  - it: proxy uses tcpSocket probes on the http port and no startup probe
    template: templates/proxy-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: http
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: http
      - isNull:
          path: spec.template.spec.containers[0].startupProbe

  - it: an app probe can be disabled with null while the others stay
    template: templates/app-deployment.yaml
    set:
      app.startupProbe: null
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - exists:
          path: spec.template.spec.containers[0].livenessProbe
      - exists:
          path: spec.template.spec.containers[0].readinessProbe

  - it: overriding one app probe field keeps the default handler
    template: templates/app-deployment.yaml
    set:
      app.livenessProbe.periodSeconds: 60
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.periodSeconds
          value: 60
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          value:
            - node
            - /dist/livenessprobe.js

  - it: proxy probes can be disabled with null
    template: templates/proxy-deployment.yaml
    set:
      proxy.livenessProbe: null
      proxy.readinessProbe: null
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe

  - it: proxy renders a startup probe when one is configured
    template: templates/proxy-deployment.yaml
    set:
      proxy.startupProbe:
        tcpSocket:
          port: http
        failureThreshold: 30
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe
          value:
            tcpSocket:
              port: http
            failureThreshold: 30
