suite: per-tier scheduling, label and annotation values are passed through
templates:
  - templates/app-deployment.yaml
  - templates/proxy-deployment.yaml
release:
  name: pwa
set:
  config.icmBaseUrl: https://icm.example.com
tests:
  - it: renders no optional scheduling fields or annotations by default
    asserts:
      - notExists:
          path: spec.template.spec.nodeSelector
      - notExists:
          path: spec.template.spec.tolerations
      - notExists:
          path: spec.template.metadata.annotations
      - notExists:
          path: metadata.annotations

  - it: app passes scheduling, labels and annotations to the right objects
    template: templates/app-deployment.yaml
    set:
      app:
        nodeSelector:
          pool: ssr
        tolerations:
          - key: dedicated
            operator: Equal
            value: ssr
            effect: NoSchedule
        podAnnotations:
          example.com/pod: app-pod
        podLabels:
          example.com/pod-label: app-pod
        deploymentAnnotations:
          example.com/deployment: app-deployment
        deploymentLabels:
          example.com/deployment-label: app-deployment
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            pool: ssr
      - equal:
          path: spec.template.spec.tolerations
          value:
            - key: dedicated
              operator: Equal
              value: ssr
              effect: NoSchedule
      - equal:
          path: spec.template.metadata.annotations
          value:
            example.com/pod: app-pod
      - equal:
          path: spec.template.metadata.labels["example.com/pod-label"]
          value: app-pod
      - notExists:
          path: spec.template.metadata.labels["example.com/deployment-label"]
      - equal:
          path: metadata.annotations
          value:
            example.com/deployment: app-deployment
      - equal:
          path: metadata.labels["example.com/deployment-label"]
          value: app-deployment
      - notExists:
          path: metadata.labels["example.com/pod-label"]
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: pwa
            app.kubernetes.io/instance: pwa
            app.kubernetes.io/component: app

  - it: proxy passes scheduling, labels and annotations to the right objects
    template: templates/proxy-deployment.yaml
    set:
      proxy:
        nodeSelector:
          pool: edge
        tolerations:
          - key: dedicated
            operator: Equal
            value: edge
            effect: NoSchedule
        podAnnotations:
          example.com/pod: proxy-pod
        podLabels:
          example.com/pod-label: proxy-pod
        deploymentAnnotations:
          example.com/deployment: proxy-deployment
        deploymentLabels:
          example.com/deployment-label: proxy-deployment
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            pool: edge
      - equal:
          path: spec.template.spec.tolerations
          value:
            - key: dedicated
              operator: Equal
              value: edge
              effect: NoSchedule
      - equal:
          path: spec.template.metadata.annotations
          value:
            example.com/pod: proxy-pod
      - equal:
          path: spec.template.metadata.labels["example.com/pod-label"]
          value: proxy-pod
      - notExists:
          path: spec.template.metadata.labels["example.com/deployment-label"]
      - equal:
          path: metadata.annotations
          value:
            example.com/deployment: proxy-deployment
      - equal:
          path: metadata.labels["example.com/deployment-label"]
          value: proxy-deployment
      - notExists:
          path: metadata.labels["example.com/pod-label"]
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: pwa
            app.kubernetes.io/instance: pwa
            app.kubernetes.io/component: proxy

  - it: one tier's values do not leak into the other tier
    template: templates/proxy-deployment.yaml
    set:
      app:
        nodeSelector:
          pool: ssr
        podAnnotations:
          example.com/pod: app-pod
    asserts:
      - notExists:
          path: spec.template.spec.nodeSelector
      - notExists:
          path: spec.template.metadata.annotations
