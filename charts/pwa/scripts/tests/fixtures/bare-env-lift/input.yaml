# 0.x bare values whose env carries SSR-only settings that lift to config in 1.0.0.
environment:
  - name: LOGLEVEL
    value: info
  - name: ICM_BASE_URL_SSR
    value: http://icm-web-wa:8080
  - name: ALLOWED_HOSTS
    value: shop.example.com,*.example.com
upstream:
  icmBaseURL: https://icm.example.com
