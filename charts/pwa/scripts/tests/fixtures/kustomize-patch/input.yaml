# Chart-less HelmRelease (Kustomize strategic-merge patch) carrying only spec.values.
# Migrated because it contains the PWA-specific `cache` block; no chart/version bump.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pwa-version-overlay
spec:
  values:
    image:
      tag: '2.0.0'
    cache:
      image:
        tag: '2.0.0'
