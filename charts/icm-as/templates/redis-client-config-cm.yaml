{{- if .Values.webLayer.redis.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "icm-as.fullname" . }}-redis-client-config-yaml
  labels:
    {{- include "icm-as.labels" . | nindent 4 }}
data:
  {{- if .Values.webLayer.redis.config }}
  redis-client-config.yaml: |
    {{- toYaml .Values.webLayer.redis.config | nindent 4}}
  {{- else }}
  redis-client-config.yaml: |
    singleServerConfig:
      timeout: 50
      retryAttempts: 1
      retryInterval: 50
      address: {{ printf "redis://%s:6379" (ternary .Release.Name (printf "%s-valkey" .Release.Name) (contains "valkey" .Release.Name) | trunc 63 | trimSuffix "-") }}
  {{- end -}}
{{- end -}}
