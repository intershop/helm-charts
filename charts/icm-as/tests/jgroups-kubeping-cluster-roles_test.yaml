suite: tests correctness of cluster role bindings for jgroups KUBE_PING discovery
templates:
  - templates/jgroups-kubeping-r.yaml
  - templates/jgroups-kubeping-rb.yaml
tests:
  - it: no roles or role-bindings if KUBE_PING is not used
    release:
      name: icm-as
    chart:
      version: 0.8.15
    values:
      - ../values.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: role jgroups KUBE_PING
    release:
      name: icm-as
    chart:
      version: 0.8.15
    values:
      - ../values.yaml
    template: "templates/jgroups-kubeping-r.yaml"
    set:
      jgroups.discovery: "kube_ping"
    asserts:
      - isKind:
          of: Role

  - it: role-binding jgroups KUBE_PING
    release:
      name: icm-as
    chart:
      version: 0.8.15
    values:
      - ../values.yaml
    template: "templates/jgroups-kubeping-rb.yaml"
    set:
      jgroups.discovery: "kube_ping"
    asserts:
      - isKind:
          of: RoleBinding
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            name: icm-as-sa
            namespace: NAMESPACE
