suite: tests correctness of newrelic section
templates:
  - templates/as-deployment.yaml
  - templates/config-newrelic-yaml-cm.yaml
tests:
  - it: newrelic is enabled so apm and metrics are enabled
    release:
      name: icm-as
    chart:
      version: 0.8.15
    values:
      - ../values.yaml
    set:
      newrelic.enabled: true
    template: templates/as-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENABLE_NEWRELIC
            value: "true"
      - equal:
          path: spec.template.metadata.annotations
          value:
            prometheus.io/path: /metrics
            prometheus.io/port: "7744"
            prometheus.io/scrape: "true"
  - it: newrelic is enabled apm is disabled
    release:
      name: icm-as
    chart:
      version: 0.8.15
    values:
      - ../values.yaml
    set:
      newrelic.enabled: true
      newrelic.apm.enabled: false
    template: templates/as-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENABLE_NEWRELIC
            value: "false"
      - equal:
          path: spec.template.metadata.annotations
          value:
            prometheus.io/path: /metrics
            prometheus.io/port: "7744"
            prometheus.io/scrape: "true"
  - it: newrelic is enabled metrics are disabled
    release:
      name: icm-as
    chart:
      version: 0.8.15
    values:
      - ../values.yaml
    set:
      newrelic.enabled: true
      newrelic.metrics.enabled: false
    template: templates/as-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ENABLE_NEWRELIC
            value: "true"
      - equal:
          path: spec.template.metadata.annotations
          value:
            prometheus.io/path: /metrics
            prometheus.io/port: "7744"
            prometheus.io/scrape: "false"
  - it: newrelic license key
    release:
      name: icm-as
    chart:
      version: 0.8.15
    values:
      - ../values.yaml
    set:
      newrelic.enabled: true
      newrelic.license_key: "secret-license-test"
    template: templates/as-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NEW_RELIC_LICENSE_KEY
            value: "secret-license-test"
  - it: newrelic license key secret key ref
    release:
      name: icm-as
    chart:
      version: 0.8.15
    values:
      - ../values.yaml
    set:
      newrelic.enabled: true
      newrelic.licenseKeySecretKeyRef.name: "your-company-prd-secrets"
      newrelic.licenseKeySecretKeyRef.key: "secret-license-test"
    template: templates/as-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NEW_RELIC_LICENSE_KEY
            valueFrom:
              secretKeyRef:
                key: secret-license-test
                name: your-company-prd-secrets
  - it: should take newrelic license key secret key ref precedence over plain text license key
    release:
      name: icm-as
    chart:
      version: 0.8.15
    values:
      - ../values.yaml
    set:
      newrelic.enabled: true
      newrelic.license_key: "should-not-appear"
      newrelic.licenseKeySecretKeyRef.name: "your-company-prd-secrets"
      newrelic.licenseKeySecretKeyRef.key: "secret-license-test"
    template: templates/as-deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: NEW_RELIC_LICENSE_KEY
            valueFrom:
              secretKeyRef:
                key: secret-license-test
                name: your-company-prd-secrets
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: NEW_RELIC_LICENSE_KEY
            value: "should-not-appear"
  - it: newrelic app_name from operationalContext (default values)
    release:
      name: icm-as
    chart:
      version: 0.8.15
    values:
      - ../values.yaml
    set:
      newrelic.enabled: true
    template: templates/config-newrelic-yaml-cm.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["newrelic.yml"]
          pattern: '.*(app_name: "icm-as-appserver").*'
  - it: newrelic log metrics (on)
    release:
      name: icm-as
    chart:
      version: 0.8.15
    values:
      - ../values.yaml
    set:
      newrelic.enabled: true
      newrelic.metrics.enabled: true
    template: templates/config-newrelic-yaml-cm.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["newrelic.yml"]
          pattern: '(?m)^\W{4}metrics:\n\W{6}enabled: true$'
  - it: newrelic log metrics (off)
    release:
      name: icm-as
    chart:
      version: 0.8.15
    values:
      - ../values.yaml
    set:
      newrelic.enabled: true
      newrelic.metrics.enabled: false
    template: templates/config-newrelic-yaml-cm.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["newrelic.yml"]
          pattern: '(?m)^\W{4}metrics:\n\W{6}enabled: false$'

  - it: should leave error collector defaults unchanged when not configured
    set:
      newrelic.enabled: true
    template: templates/config-newrelic-yaml-cm.yaml
    asserts:
      - notMatchRegex:
          path: data["newrelic.yml"]
          pattern: 'error_collector:'

  - it: should configure HTTP 401 as an expected error
    set:
      newrelic.enabled: true
      newrelic.apm.errorCollector.expected_status_codes: "401"
    template: templates/config-newrelic-yaml-cm.yaml
    asserts:
      - matchRegex:
          path: data["newrelic.yml"]
          pattern: '(?m)^  error_collector:\n    expected_status_codes: "401"$'

  - it: should preserve expected status code ranges
    set:
      newrelic.enabled: true
      newrelic.apm.errorCollector.expected_status_codes: "401,409-410"
    template: templates/config-newrelic-yaml-cm.yaml
    asserts:
      - matchRegex:
          path: data["newrelic.yml"]
          pattern: '(?m)^  error_collector:\n    expected_status_codes: 401,409-410$'

  - it: should preserve expected status code lists
    set:
      newrelic.enabled: true
      newrelic.apm.errorCollector.expected_status_codes:
        - 401
        - 409
    template: templates/config-newrelic-yaml-cm.yaml
    asserts:
      - matchRegex:
          path: data["newrelic.yml"]
          pattern: '(?m)^  error_collector:\n    expected_status_codes:\n    - 401\n    - 409$'

  - it: should preserve structured expected error classes and messages
    set:
      newrelic.enabled: true
      newrelic.apm.errorCollector:
        expected_classes:
          - class_name: com.example.ExpectedException
            message: "Known failure: retry later"
        expected_messages:
          com.example.ValidationException:
            - "Invalid input: missing value"
    template: templates/config-newrelic-yaml-cm.yaml
    asserts:
      - matchRegex:
          path: data["newrelic.yml"]
          pattern: '(?m)^  error_collector:\n    expected_classes:\n    - class_name: com.example.ExpectedException\n      message: ''Known failure: retry later''$'
      - matchRegex:
          path: data["newrelic.yml"]
          pattern: '(?m)^    expected_messages:\n      com.example.ValidationException:\n      - ''Invalid input: missing value''$'

  - it: should not render agent configuration when New Relic is disabled
    set:
      newrelic.enabled: false
      newrelic.apm.errorCollector.expected_status_codes: "401"
    template: templates/config-newrelic-yaml-cm.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should fail if both New Relic and OpenTelemetry are enabled
    values:
      - ../values.yaml
    set:
      newrelic.enabled: true
      openTelemetry.enabled: true
    template: templates/config-newrelic-yaml-cm.yaml
    asserts:
      - failedTemplate:
          errorMessage: "Error: newrelic.enabled is true so value openTelemetry.enabled must not be true at the same time."
