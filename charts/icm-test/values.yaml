test:
  enabled: false
  testrunner:
    persistence:
      testdata:
        size: 1Gi
        type: local
        local:
          dir: /invaliddir

# Restore database from a dump file found in a dumpfile directory
dumpfileRestore:
  enabled: false
  # Path to directory containing the .dmp or .bak file
  dumpfileDir: /data/dumpfile
  image:
    repository: mcr.microsoft.com/mssql-tools:latest
  # Max seconds to wait for MSSQL to become ready
  waitTimeout: 120

# Generate a production-like encryption configuration (intershop.keystore, random, encryption.properties)
# with the Intershop encryption tool before icm-as starts (helm pre-install hook).
# Allows to run icm-as with strict mode enabled (default), see https://knowledge.intershop.com/kb/312S25
# Requires icm.icm-as.persistence.encryption.type=existingClaim, the claim is created by this chart.
encryptionGenerate:
  enabled: false
  image:
    repository: intershophub/icm-as-libraries-encryption:3.1.1
    pullPolicy: IfNotPresent
  # arguments passed to the encryption tool, files are generated into /intershop/target
  args:
    - generate
  # PVC holding the generated files (mounted as encryption volume by icm-as and its job pods)
  size: 1Gi
  # empty = cluster default storage class
  storageClass: ""
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # image used to verify the generated files and to restrict their permissions
  verifyImage:
    repository: busybox:1.36.1
    pullPolicy: IfNotPresent
  # security context of the job pod: all containers run as the icm-as user (no root required),
  # fsGroup makes the volume writable for this user and the generated files are owned by it
  # (volumes without fsGroup support, e.g. azurefile, rely on their mount options instead)
  podSecurityContext:
    runAsUser: 150
    runAsGroup: 150
    runAsNonRoot: true
    fsGroup: 150
    fsGroupChangePolicy: OnRootMismatch
  verifyResources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi
