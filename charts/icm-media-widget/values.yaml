scaling:
  enabled: true
  maxReplicas: 4
  pollingSeconds: 15
  cooldownSeconds: 300
  targetJobs: 1
  failureThreshold: 3
  fallbackReplicas: 1
  stabilizationSeconds: 300

# Optional, pre-installed KEDA HTTP add-on; never installed by this chart.
httpScaling:
  addOnVersion: "0.11.1"
  clusterDomain: cluster.local
  interceptor:
    namespace: ""
    service: ""
    port: 8080
    podPort: 8080
    podLabels: { }
  widget:
    enabled: false
    # Vaadin sessions are pod-local. Do not add replicas without a session-aware architecture.
    minReplicas: 1
    maxReplicas: 1
    targetConcurrency: 10
    scaledownSeconds: 600
    conditionWaitSeconds: 20
    responseHeaderSeconds: 630
  rest:
    enabled: false
    minReplicas: 0
    maxReplicas: 4
    targetConcurrency: 1
    scaledownSeconds: 600
    # Leave room inside the worker JWT's 60-second lifetime for forwarding and verification.
    conditionWaitSeconds: 20
    responseHeaderSeconds: 630
