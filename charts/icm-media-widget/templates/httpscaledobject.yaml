{{- $root := . }}
{{- range $role := list "widget" "rest" }}
{{- $settings := index $root.Values.httpScaling $role }}
{{- if $settings.enabled }}
---
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: {{ include "media.name" $root }}-{{ $role }}
  labels:
    {{- include "media.labels" $root | nindent 4 }}
  annotations:
    httpscaledobject.keda.sh/skip-scaledobject-creation: "false"
spec:
  hosts:
    {{- if eq $role "widget" }}
    - {{ $root.Values.ingress.public.host | quote }}
    - {{ $root.Values.ingress.management.host | quote }}
    {{- else }}
    - {{ include "media.restHost" $root | quote }}
    {{- end }}
  pathPrefixes:
    - {{ if eq $role "widget" }}"/mediawidget"{{ else }}"/api/tenants/"{{ end }}
  scaleTargetRef:
    name: {{ include "media.name" $root }}-{{ $role }}
    kind: Deployment
    apiVersion: apps/v1
    service: {{ include "media.name" $root }}-{{ $role }}
    port: 8080
  replicas:
    min: {{ $settings.minReplicas }}
    max: {{ $settings.maxReplicas }}
  scaledownPeriod: {{ $settings.scaledownSeconds }}
  scalingMetric:
    concurrency:
      targetValue: {{ $settings.targetConcurrency }}
  timeouts:
    conditionWait: {{ printf "%ds" (int $settings.conditionWaitSeconds) | quote }}
    responseHeader: {{ printf "%ds" (int $settings.responseHeaderSeconds) | quote }}
{{- end }}
{{- end }}
