{{- $root := . }}
{{- range $role := list "widget" "rest" "coordinator" "control-api" "imgproxy" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "media.name" $root }}-{{ $role }}
spec:
  type: ClusterIP
  ports:
    - {name: http, port: 8080, targetPort: http}
  selector:
    {{- include "media.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $role }}
{{- end }}
