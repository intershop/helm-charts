{{- if .Values.scaling.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "media.name" . }}-archive
spec:
  scaleTargetRef:
    name: {{ include "media.name" . }}-archive
  minReplicaCount: 0
  maxReplicaCount: {{ .Values.scaling.maxReplicas }}
  pollingInterval: {{ .Values.scaling.pollingSeconds }}
  cooldownPeriod: {{ .Values.scaling.cooldownSeconds }}
  fallback:
    failureThreshold: {{ .Values.scaling.failureThreshold }}
    replicas: {{ .Values.scaling.fallbackReplicas }}
  advanced:
    horizontalPodAutoscalerConfig:
      name: {{ include "media.name" . }}-archive
      behavior:
        scaleDown:
          stabilizationWindowSeconds: {{ .Values.scaling.stabilizationSeconds }}
          policies:
            - {type: Pods, value: 1, periodSeconds: 60}
  triggers:
    - type: metrics-api
      metricType: AverageValue
      metadata:
        url: {{ printf "http://%s-coordinator.%s.svc:8080/internal/backlog" (include "media.name" .) .Release.Namespace | quote }}
        format: json
        valueLocation: metricValue
        targetValue: {{ .Values.scaling.targetJobs | quote }}
        activationTargetValue: "0"
{{- end }}
