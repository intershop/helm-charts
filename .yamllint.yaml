# yamllint configuration for chart-testing (`ct lint`).
# Aligned with .editorconfig and the Prettier config: 2-space indent, LF, final newline.
extends: default

rules:
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 0
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 0
  comments:
    require-starting-space: true
    min-spaces-from-content: 1
  comments-indentation: disable
  document-start: disable
  empty-lines:
    max: 1
    max-start: 0
    max-end: 0
  indentation:
    spaces: 2
    indent-sequences: consistent
    check-multi-line-strings: false
  key-duplicates: enable
  # Prettier does not wrap YAML, so keep line-length as a non-blocking warning.
  line-length:
    max: 120
    level: warning
  new-line-at-end-of-file: enable
  new-lines:
    type: unix
  trailing-spaces: enable
  truthy:
    allowed-values: ['true', 'false']
    check-keys: false
